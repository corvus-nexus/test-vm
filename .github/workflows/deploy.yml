name: Deploy Odoo safely

on:
  workflow_dispatch:
    inputs:
      image:
        description: Exact GHCR sha-COMMIT tag or sha256 digest to deploy
        required: true
        type: string
      modules:
        description: Comma-separated technical module names
        required: false
        type: string
      image_only:
        description: Deploy image without updating modules
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.route.outputs.environment }}
    steps:
      - name: Check out the canonical branch resolver
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .ci/resolve_environment.py
          sparse-checkout-cone-mode: false

      - name: Resolve exact deployment environment
        id: route
        shell: bash
        env:
          REQUESTED_BRANCH: ${{ github.ref_name }}
          REQUESTED_REF_TYPE: ${{ github.ref_type }}
          REQUESTED_FULL_REF: ${{ github.ref }}
          DEVELOPMENT_BRANCH: "19.0-dev"
          STAGING_BRANCH: "19.0-sass-3"
          LIVE_BRANCH: "19.0"
        run: |
          set -Eeuo pipefail
          python3 .ci/resolve_environment.py \
            --ref "$REQUESTED_BRANCH" \
            --ref-type "$REQUESTED_REF_TYPE" \
            --full-ref "$REQUESTED_FULL_REF" \
            --development "$DEVELOPMENT_BRANCH" \
            --staging "$STAGING_BRANCH" \
            --live "$LIVE_BRANCH" \
            --github-output "$GITHUB_OUTPUT"

  deploy:
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-${{ needs.route.outputs.environment }}
      cancel-in-progress: false
    environment: ${{ needs.route.outputs.environment }}
    steps:
      - name: Derive and validate deployment inputs
        id: meta
        shell: bash
        env:
          DISPATCH_MODULES: ${{ inputs.modules }}
          DEFAULT_MODULES: ${{ vars.ODOO_DEPLOY_MODULES }}
          IMAGE_ONLY: ${{ inputs.image_only }}
          INPUT_IMAGE: ${{ inputs.image }}
          ROUTED_ENVIRONMENT: ${{ needs.route.outputs.environment }}
        run: |
          set -Eeuo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          expected="ghcr.io/${owner}/${repository,,}"
          image="$INPUT_IMAGE"
          [[ "$image" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._/-]+(@sha256:[a-f0-9]{64}|:sha-[a-f0-9]{40})$ ]] || { echo 'Image must use an immutable sha-COMMIT tag or sha256 digest.' >&2; exit 1; }
          [[ "$image" == "$expected":* || "$image" == "$expected"@sha256:* ]] || { echo 'Image is outside this repository package.' >&2; exit 1; }
          modules="${DISPATCH_MODULES:-$DEFAULT_MODULES}"
          image_only="${IMAGE_ONLY:-false}"
          [[ -z "$modules" || "$modules" =~ ^[A-Za-z0-9_]+(,[A-Za-z0-9_]+)*$ ]] || { echo 'Module list is malformed.' >&2; exit 1; }
          printf 'environment=%s\nimage=%s\nmodules=%s\nimage_only=%s\n' \
            "$ROUTED_ENVIRONMENT" "$image" "$modules" "$image_only" >> "$GITHUB_OUTPUT"

      - name: Validate deployment connection settings
        shell: bash
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_PORT: ${{ vars.VM_SSH_PORT }}
          VM_USER: ${{ vars.VM_USER }}
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          missing=()
          [[ -n "$VM_HOST" ]] || missing+=(VM_HOST)
          [[ -n "$VM_USER" ]] || missing+=(VM_USER)
          [[ -n "$SSH_KEY" ]] || missing+=(VM_SSH_KEY)
          [[ -n "$SSH_KNOWN_HOSTS" ]] || missing+=(VM_SSH_KNOWN_HOSTS)
          if ((${#missing[@]})); then
            printf 'Missing GitHub environment connection settings: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          [[ "$VM_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'VM_HOST must be a hostname or IP address without a scheme.' >&2; exit 1; }
          [[ "$VM_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'VM_USER is malformed.' >&2; exit 1; }
          port="${VM_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] && ((port >= 1 && port <= 65535)) || { echo 'VM_SSH_PORT must be between 1 and 65535.' >&2; exit 1; }

      - name: Configure SSH
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_PORT: ${{ vars.VM_SSH_PORT }}
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          port="${VM_PORT:-22}"
          lookup="$VM_HOST"
          if [[ "$port" != 22 ]]; then lookup="[$VM_HOST]:$port"; fi
          ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts >/dev/null || {
            echo "VM_SSH_KNOWN_HOSTS has no entry for $lookup" >&2
            exit 1
          }

      - name: Guarded deployment on server
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_PORT: ${{ vars.VM_SSH_PORT }}
          VM_USER: ${{ vars.VM_USER }}
          ENVIRONMENT: ${{ steps.meta.outputs.environment }}
          IMAGE: ${{ steps.meta.outputs.image }}
          MODULES: ${{ steps.meta.outputs.modules }}
          IMAGE_ONLY: ${{ steps.meta.outputs.image_only }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          port="${VM_PORT:-22}"
          mode=auto
          module_arg=-
          if [[ "$IMAGE_ONLY" == true ]]; then
            mode=image
          elif [[ -n "$MODULES" ]]; then
            mode=modules
            module_arg="$MODULES"
          fi
          request="deploy $ENVIRONMENT $IMAGE $mode $module_arg $GITHUB_ACTOR"
          printf '%s\n' "$GHCR_TOKEN" | \
            ssh -p "$port" -o BatchMode=yes "$VM_USER@$VM_HOST" "$request"
